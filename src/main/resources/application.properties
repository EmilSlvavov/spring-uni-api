spring.application.name=spring-uni-api

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=university_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=hibernate_user
spring.datasource.password=hibernate

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

logging.pattern.level=%5p [%X{traceId:-}]

logging.level.org.springframework.security=DEBUG

user.seed.password=${SEED_PASSWORD}

user.jwt.secret=${JWT_SECRET}
user.jwt.ttl-minutes=15

user.jwt.refresh-ttl-days=7

spring.data.redis.host=localhost
spring.data.redis.port=6379