# Test-only config. Keeps @DataJpaTest off the real SQL Server instance.
spring.datasource.url=jdbc:h2:mem:unitest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.profiles.active=test

user.jwt.secret=dGVzdC1vbmx5LXNlY3JldC1uZXZlci11c2VkLWFueXdoZXJlLWVsc2U=
user.jwt.ttl-minutes=15

user.jwt.refresh-ttl-days=7
user.jwt.max-active-refresh-tokens=5